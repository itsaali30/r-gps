<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle radar circles -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="240" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="256" cy="240" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Crosshair axes -->
  <line x1="256" y1="60" x2="256" y2="420" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="80" y1="240" x2="432" y2="240" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  
  <!-- GPS Pin -->
  <g filter="url(#shadow)">
    <path d="M256 100 C185 100 128 157 128 228 C128 320 256 420 256 420 C256 420 384 320 384 228 C384 157 327 100 256 100 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="6"/>
    <!-- Inner glowing circle -->
    <circle cx="256" cy="228" r="44" fill="#ffffff"/>
    <circle cx="256" cy="228" r="26" fill="#0284c7"/>
    <!-- Small center dot -->
    <circle cx="256" cy="228" r="10" fill="#38bdf8"/>
  </g>
  
  <!-- Mock / Swap Arrows badge -->
  <circle cx="360" cy="360" r="48" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <path d="M344 350 L376 350 M376 350 L364 338 M376 350 L364 362 M376 370 L344 370 M344 370 L356 358 M344 370 L356 382" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
